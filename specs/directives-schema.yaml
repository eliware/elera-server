$schema: https://json-schema.org/draft/2020-12/schema
$ref: "#/$defs/document"
$defs:
  document:
    type: object
    required:
      - version
      - description
      - directives
    properties:
      version:
        type: string
        minLength: 1
        pattern: \S
      description:
        type: string
        minLength: 1
        pattern: \S
      requires:
        type: array
        items:
          type: string
          pattern: ^[a-z0-9-]+$
      conflicts:
        type: array
        items:
          type: string
          pattern: ^[a-z0-9-]+$
      directives:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/directive"
    additionalProperties: false
  directive:
    type: object
    required:
      - id
      - dos
      - donts
    properties:
      id:
        type: string
        pattern: ^E-[0-9]+(?:\.[0-9]+)*$
      dos:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
          pattern: \S
      donts:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
          pattern: \S
      examples:
        type: array
        minItems: 1
        items:
          type: string
          minLength: 1
          pattern: \S
      children:
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/directive"
    additionalProperties: false
