name: Publish

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm -g install npm@latest
      - run: npm ci
      - run: npm test

  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: ghcr-publish
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7
      - run: >-
          node -e "const version=require('./package.json').version;
          if(process.env.GITHUB_REF_NAME!=='v'+version)process.exit(1)"
      - id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
      - uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - run: >-
          test "$(docker buildx imagetools inspect "$IMAGE_NAME:$GITHUB_REF_NAME" --format
          '{{.Manifest.Digest}}')" = "${{ steps.image.outputs.digest }}"
      - run: docker buildx imagetools inspect "$IMAGE_NAME@${{ steps.image.outputs.digest }}"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh attestation verify "oci://$IMAGE_NAME@${{ steps.image.outputs.digest }}"
          --repo "${{ github.repository }}"
      - run: echo "${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
